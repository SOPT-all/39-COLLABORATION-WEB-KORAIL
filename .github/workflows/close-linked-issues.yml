name: Close linked issues

on:
  pull_request:
    branches: [develop]
    types: [closed]

permissions:
  issues: write

jobs:
  close-issues:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Close issues listed in the PR body
        uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.pull_request.body ?? '';
            const matches = body.matchAll(/^(?:>[ \t]*)?Closes[ \t]+#([1-9]\d*)[ \t]*\r?$/gim);
            const issueNumbers = new Set(
              Array.from(matches, (match) => Number(match[1]))
            );

            for (const issueNumber of issueNumbers) {
              const params = { ...context.repo, issue_number: issueNumber };
              const { data: issue } = await github.rest.issues.get(params);

              if (issue.state === 'open' && !issue.pull_request) {
                await github.rest.issues.update({
                  ...params,
                  state: 'closed',
                  state_reason: 'completed',
                });
              }
            }
