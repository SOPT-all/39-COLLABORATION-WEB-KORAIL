name: '🛠️ Fix'
description: '발생한 오류와 수정 작업을 등록합니다.'
title: 'Fix: '
body:
  - type: textarea
    id: describe
    attributes:
      label: Describe
      description: 오류 재현 방법, 현재 동작, 기대 동작을 작성해주세요.
      placeholder: |
        재현 방법:
        현재 동작:
        기대 동작:
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: 수정 및 확인할 내용을 체크리스트로 작성해주세요.
      value: '- [ ] '
    validations:
      required: true

  - type: textarea
    id: etc
    attributes:
      label: ETC
      description: 오류 화면, 로그 또는 참고 자료를 작성해주세요.
    validations:
      required: false
