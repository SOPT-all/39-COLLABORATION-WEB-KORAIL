name: '♻️ Refactor'
description: '기존 동작을 유지하면서 코드를 개선하는 작업을 등록합니다.'
title: 'Refactor: '
body:
  - type: textarea
    id: describe
    attributes:
      label: Describe
      description: 개선할 코드와 개선이 필요한 이유를 작성해주세요.
      placeholder: '예: 여러 화면에서 반복되는 버튼을 공통 컴포넌트로 분리합니다.'
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: 개선 및 확인할 내용을 체크리스트로 작성해주세요.
      value: '- [ ] '
    validations:
      required: true

  - type: textarea
    id: etc
    attributes:
      label: ETC
      description: 영향을 받는 화면이나 참고 자료를 작성해주세요.
    validations:
      required: false
