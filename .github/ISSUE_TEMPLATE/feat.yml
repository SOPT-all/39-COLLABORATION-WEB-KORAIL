name: "🧞‍♂️ Feat"
description: "새로운 화면이나 기능 개발 작업을 등록합니다."
title: "Feat: "
body:
  - type: textarea
    id: describe
    attributes:
      label: Describe
      description: 구현할 기능과 기대 동작을 작성해주세요.
      placeholder: "예: 서버에서 받은 열차 목록을 카드 형태로 표시합니다."
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: 작업 내용을 체크리스트로 작성해주세요.
      value: "- [ ] "
    validations:
      required: true

  - type: textarea
    id: etc
    attributes:
      label: ETC
      description: 관련 Figma, API 명세 또는 참고 자료를 작성해주세요.
    validations:
      required: false
